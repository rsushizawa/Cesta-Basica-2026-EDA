[project]
name = "cestameans"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rodrigo Seiji Yugoshi Ushizawa", email = "rodrigo.syu@puccampinas.edu.br" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyyaml>=6.0.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
cestameans = "cestameans:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
